[package]
name = "macpulse"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
plist = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
trash = "5"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"
