name: Build MacPulse.app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo test
      - run: ./scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacPulse-dmg
          path: dist/MacPulse.dmg
